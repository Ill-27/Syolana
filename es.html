<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light">
    <title>Polyglot Mastery | Code Interface</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>

    <style>
        :root {
            color-scheme: light;
            --bg-color: #ffffff;
            --text-main: #000000;
            --text-dim: #555555;
            --accent-purple: #000000;
            --accent-blue: #333333;
            --accent-white: #000000;
            --border-color: rgba(0, 0, 0, 0.2);
            --transition: all 0.25s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            background-color: var(--bg-color) !important;
            color: var(--text-main) !important;
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 0;
        }

        /* Канвас для звезд */
        #starCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1; 
            pointer-events: none;
        }

        .top-bar { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            padding: 25px 30px; 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            z-index: 100; 
            pointer-events: none; 
        }
        
        .brand-logo-container { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            cursor: pointer; 
            pointer-events: auto; 
            transition: transform 0.3s ease; 
            text-decoration: none; 
        }
        .brand-logo-container:hover { transform: scale(1.05); }
        .brand-logo { width: 55px; height: 55px; }
        .brand-logo svg { width: 100%; height: 100%; filter: drop-shadow(0 0 5px rgba(0,0,0,0.2)); }
        .brand-text { display: flex; flex-direction: column; }
        .brand-text-title { color: var(--text-main); font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; font-weight: 600; line-height: 1; }
        .brand-text-sub { color: var(--text-dim); font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }

        .right-controls { display: flex; flex-direction: column; gap: 15px; align-items: center; pointer-events: auto; }
        .action-circle-btn { 
            background: rgba(255, 255, 255, 0.4); 
            border: 1px solid rgba(0, 0, 0, 0.2); 
            color: var(--text-main); 
            font-size: 1.2rem; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            outline: none; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 45px; 
            height: 45px; 
            border-radius: 50%;
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }
        .action-circle-btn:hover { border-color: rgba(0, 0, 0, 0.5); background: rgba(255, 255, 255, 0.8); transform: scale(1.05); }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 100px 20px 60px 20px;
            position: relative;
            z-index: 2; 
        }

        /* Легкое, почти невидимое стекло для плашек */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05) !important; 
            border: 1px solid rgba(0, 0, 0, 0.15);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(3px); 
            -webkit-backdrop-filter: blur(3px);
            border-radius: 12px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            padding-bottom: 30px;
            padding-top: 25px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.05em;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-muted) !important;
            max-width: 600px;
            margin: 0 auto;
            font-weight: 300;
        }

        .accordion {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .accordion-item {
            border-radius: 12px; 
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            border: 1px solid rgba(0, 0, 0, 0.2);
        }

        .accordion-header {
            padding: 20px 25px;
            font-size: 1.2rem;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.85) !important;
            color: #ffffff !important;
            border: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .accordion-content {
            padding: 25px;
            background: transparent !important; 
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .level-card {
            border-radius: 8px;
            padding: 20px;
            transition: var(--transition);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.1) !important;
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            border: 1px solid rgba(0, 0, 0, 0.15);
        }

        .level-card:hover {
            border-color: rgba(0, 0, 0, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            background: rgba(255, 255, 255, 0.2) !important;
        }

        .level-badge {
            position: absolute;
            top: -10px;
            right: 15px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 4px;
        }

        .badge-free {
            background: rgba(255, 255, 255, 0.9) !important;
            border: 1px solid rgba(0, 0, 0, 0.3) !important;
            color: var(--text-main) !important;
        }

        .badge-pro {
            background: rgba(0, 0, 0, 0.85) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: #ffffff !important;
        }

        .level-title {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            color: var(--text-main) !important;
        }

        .media-buttons {
            display: flex;
            gap: 8px;
            flex-direction: column; 
        }

        .btn {
            width: 100%;
            padding: 12px 10px; 
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.4) !important;
            border: 1px solid rgba(0, 0, 0, 0.2);
            color: var(--text-main) !important;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            text-align: center;
            text-decoration: none;
        }

        .btn:hover {
            border-color: rgba(0, 0, 0, 0.5);
            background: rgba(255, 255, 255, 0.8) !important;
        }

        .btn-locked {
            background: rgba(0, 0, 0, 0.05) !important;
            color: rgba(0,0,0,0.4) !important;
            border: 1px dashed rgba(0,0,0,0.2);
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .accordion-header { padding: 15px 20px; font-size: 1.1rem; }
            .level-grid { grid-template-columns: 1fr; }
            .brand-text { display: none; }
            .top-bar { padding: 15px 20px; }
        }
    </style>
</head>
<body>

    <canvas id="starCanvas"></canvas>

    <div class="top-bar" id="ui-top">
        <a href="#" onclick="window.scrollTo({top:0, behavior:'smooth'})" class="brand-logo-container">
            <div class="brand-logo">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs><filter id="logoGlow"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
                    <g stroke="#000000" stroke-width="1.5" fill="rgba(0, 0, 0, 0.05)" filter="url(#logoGlow)">
                        <path d="M50,15 C60,28 65,42 50,50 C35,42 40,28 50,15 Z" />
                        <path d="M50,50 C65,42 85,32 90,47 C80,57 65,57 50,50 Z" />
                        <path d="M50,50 C35,42 15,32 10,47 C20,57 35,57 50,50 Z" />
                        <path d="M50,50 C65,60 75,80 60,90 C50,80 50,65 50,50 Z" />
                        <path d="M50,50 C35,60 25,80 40,90 C50,80 50,65 50,50 Z" />
                        <circle cx="50" cy="50" r="4" fill="#000000" stroke="none" opacity="1"/>
                    </g>
                    <text x="50" y="58" font-family="'JetBrains Mono', monospace" font-size="28" fill="#000000" text-anchor="middle" font-weight="600" letter-spacing="1">PM</text>
                </svg>
            </div>
            <div class="brand-text">
                <span class="brand-text-title">Polyglot Mastery</span>
                <span class="brand-text-sub">Code Interface</span>
            </div>
        </a>
        <div class="right-controls">
            <button id="fullscreen-btn" class="action-circle-btn"><i class="fa-solid fa-expand"></i></button>
        </div>
    </div>

    <div class="container">
        <header class="glass-panel">
            <h1>Абсолютное погружение</h1>
            <p class="subtitle">/> Системный подход к освоению языков_</p>
        </header>

        <section class="accordion">
            
            <div class="accordion-item">
                <div class="accordion-header">> Испанский язык (Español)</div>
                <div class="accordion-content">
                    <div class="level-grid">
                        <div class="level-card">
                            <span class="level-badge badge-free">Free</span>
                            <div class="level-title">A1</div>
                            <div class="media-buttons">
                                <a href="a1-spanish-rules.html" class="btn">Правила А1</a>
                                <a href="a1-spanish-words.html" class="btn">Слова А1</a>
                                <a href="a1-spanish-practice.html" class="btn">Практика А1</a>
                            </div>
                        </div>
                        <div class="level-card">
                            <span class="level-badge badge-pro">Pro</span>
                            <div class="level-title">A2</div>
                            <div class="media-buttons">
                                <button class="btn btn-locked">Доступ закрыт</button>
                            </div>
                        </div>
                        <div class="level-card">
                            <span class="level-badge badge-pro">Pro</span>
                            <div class="level-title">B1</div>
                            <div class="media-buttons">
                                <button class="btn btn-locked">Доступ закрыт</button>
                            </div>
                        </div>
                        <div class="level-card">
                            <span class="level-badge badge-pro">Pro</span>
                            <div class="level-title">B2</div>
                            <div class="media-buttons">
                                <button class="btn btn-locked">Доступ закрыт</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
        </section>
    </div>

    <script>
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];

        const starColors = ['#FF003C', '#0055FF', '#FFB300', '#00C853', '#AA00FF', '#00E5FF'];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Star {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height : height + 10;
                
                this.size = Math.random() * 2.5 + 0.5; 
                
                this.speedY = -(Math.random() * 1.5 + 0.5); 
                this.speedX = (Math.random() - 0.5) * 0.8; 
                
                this.color = starColors[Math.floor(Math.random() * starColors.length)];
                
                this.angle = Math.random() * Math.PI * 2;
                this.blinkSpeed = Math.random() * 0.04 + 0.01;
                this.baseOpacity = Math.random() * 0.6 + 0.2; 
                this.currentOpacity = this.baseOpacity;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.y < -20) this.reset();
                if (this.x < -20) this.x = width + 20;
                if (this.x > width + 20) this.x = -20;

                this.angle += this.blinkSpeed;
                this.currentOpacity = this.baseOpacity + Math.sin(this.angle) * 0.4;
                
                if (this.currentOpacity < 0.1) this.currentOpacity = 0.1; 
                if (this.currentOpacity > 1) this.currentOpacity = 1;
            }

            draw() {
                ctx.globalAlpha = this.currentOpacity;
                
                ctx.shadowBlur = this.size * 2;
                ctx.shadowColor = this.color;
                
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 0; 
            }
        }

        function initStars() {
            stars = [];
            const numStars = 500; 
            for (let i = 0; i < numStars; i++) {
                stars.push(new Star());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            initStars();
        });

        resize();
        initStars();
        animate();

        // Полноэкранный режим
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) { 
                document.documentElement.requestFullscreen(); 
                fullscreenBtn.querySelector('i').classList.replace('fa-expand', 'fa-compress'); 
            } else { 
                document.exitFullscreen(); 
                fullscreenBtn.querySelector('i').classList.replace('fa-compress', 'fa-expand'); 
            }
        });
    </script>
</body>
</html>
