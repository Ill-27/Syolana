<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los ojos verdes — Интерактивный тренажер испанского языка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --accent: #10b981;
            --accent-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #475569;
            --gold: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        header {
            background: linear-gradient(135deg, #064e3b, #0f172a);
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        header h1 { font-family: 'Merriweather', serif; font-size: 2.2rem; color: #a7f3d0; margin-bottom: 0.5rem; }
        header p { color: var(--text-muted); font-size: 1rem; max-width: 600px; margin: 0 auto; }

        nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            background: var(--bg-secondary);
            padding: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        nav button {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        nav button.active, nav button:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }

        .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Reader Mode */
        .reader-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            background: var(--bg-secondary);
            padding: 12px 20px;
            border-radius: 10px;
        }

        .sentence-card {
            background: var(--bg-secondary);
            border-left: 4px solid var(--accent);
            padding: 15px 20px;
            margin-bottom: 12px;
            border-radius: 0 8px 8px 0;
            transition: transform 0.1s;
        }

        .sentence-card:hover { transform: translateX(3px); }
        .es-text { font-family: 'Merriweather', serif; font-size: 1.1rem; color: #ffffff; margin-bottom: 6px; }
        .ru-text { color: var(--text-muted); font-size: 0.95rem; display: block; }
        .ru-text.hidden { display: none; }

        .audio-btn {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 0.9rem;
            margin-left: 10px;
            text-decoration: underline;
        }

        /* Dict & Grammar */
        .grid-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
        }

        .card {
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .card h3 { color: var(--gold); margin-bottom: 5px; font-size: 1.1rem; }
        .card p { font-size: 0.9rem; color: var(--text-muted); }

        .grammar-rule {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .grammar-rule h3 { color: var(--accent); margin-bottom: 8px; }

        /* Quiz */
        .quiz-option {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: #fff;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }

        .quiz-option:hover { background: var(--border); }
        .quiz-option.correct { background: #059669; border-color: #10b981; }
        .quiz-option.incorrect { background: #991b1b; border-color: #ef4444; }

        .btn-action {
            background: var(--accent);
            color: #000;
            font-weight: 600;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--border); transition: .4s; border-radius: 22px;
        }
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(22px); }
    </style>
</head>
<body>

<header>
    <h1>Los ojos verdes</h1>
    <p>Интерактивный тренажер испанского языка от Bécquer — Уровень 0 до B2</p>
</header>

<nav>
    <button class="nav-btn active" onclick="switchTab('reader')">📖 Читальный зал</button>
    <button class="nav-btn" onclick="switchTab('vocab')">📚 Словарь</button>
    <button class="nav-btn" onclick="switchTab('grammar')">🧠 Грамматика</button>
    <button class="nav-btn" onclick="switchTab('quiz')">🧪 Интерактивный тест</button>
</nav>

<div class="container">

    <!-- READER TAB -->
    <div id="reader" class="tab-content active">
        <div class="reader-controls">
            <span>Показывать русский перевод</span>
            <label class="switch">
                <input type="checkbox" id="toggleTranslation" checked onchange="toggleRu()">
                <span class="slider"></span>
            </label>
        </div>
        <div id="textContainer"></div>
    </div>

    <!-- VOCAB TAB -->
    <div id="vocab" class="tab-content">
        <h2 style="margin-bottom: 1rem;">Словарный запас легенды</h2>
        <div class="grid-list" id="vocabContainer"></div>
    </div>

    <!-- GRAMMAR TAB -->
    <div id="grammar" class="tab-content">
        <h2 style="margin-bottom: 1rem;">Грамматические конструкции и устойчивые выражения</h2>
        <div id="grammarContainer"></div>
    </div>

    <!-- QUIZ TAB -->
    <div id="quiz" class="tab-content">
        <h2 style="margin-bottom: 1rem;">Проверьте знания текста</h2>
        <div id="quizContainer" class="card"></div>
    </div>

</div>

<script>
const sentences = [
    { es: "Hace mucho tiempo que tenía ganas de escribir cualquier cosa con este título.", ru: "Уже давно мне хотелось написать что-нибудь под этим заголовком." },
    { es: "Hoy, que se me ha presentado ocasión, lo he puesto con letras grandes en la primera cuartilla de papel, y luego he dejado a capricho volar la pluma.", ru: "Сегодня, когда мне представился случай, я написал его крупными буквами на первом листе бумаги, а затем позволил перу лететь, куда ему вздумается." },
    { es: "Yo creo que he visto unos ojos como los que he pintado en esta leyenda.", ru: "Я верю, что видел глаза, подобные тем, что описал в этой легенде." },
    { es: "No sé si en sueños, pero yo los he visto.", ru: "Не знаю, во сне ли, но я их видел." },
    { es: "De seguro no los podré describir tal cuales ellos eran: luminosos, transparentes como las gotas de la lluvia...", ru: "Наверняка я не смогу описать их точно такими, какими они были: светящимися, прозрачными, как капли дождя..." },
    { es: "Herido va el ciervo…, herido va… no hay duda.", ru: "Раненый идет олень... раненый... сомнений нет." },
    { es: "Se ve el rastro de la sangre entre las zarzas del monte...", ru: "Виден кровавый след среди терновых кустов на горе..." },
    { es: "En cuarenta años de montero no he visto mejor golpe…", ru: "За сорок лет работы егерем я не видел лучшего удара..." },
    { es: "¡Por San Saturio, patrón de Soria!, cortadle el paso por esas carrascas...", ru: "Ради Святого Сатурио, покровителя Сории, перережьте ему путь через эти каменные дубы..." },
    { es: "Porque esa trocha conduce a la fuente de los Álamos...", ru: "Потому что эта тропа ведет к источнику Тополей..." },
    { es: "En cuyas aguas habita un espíritu del mal.", ru: "В чьих водах обитает злой дух." },
    { es: "El que osa enturbiar su corriente paga caro su atrevimiento.", ru: "Тот, кто смеет мутить его течение, дорого платит за свою дерзость." },
    { es: "Fiera que se refugia en esta fuente misteriosa, pieza perdida.", ru: "Зверь, укрывшийся в этом таинственном источнике — потерянная добыча." },
    { es: "Primero perderé yo el señorío de mis padres, y primero perderé el ánima en manos de Satanás, que permitir que se me escape ese ciervo.", ru: "Скорее я потеряю владения своих предков и скорее отдам душу Сатане, чем позволю этому оленю уйти." },
    { es: "Caballo y jinete partieron como un huracán.", ru: "Конь и всадник помчались подобно урагану." },
    { es: "Con el diablo no sirven valentías.", ill: "С дьяволом храбрость не помогает.", ru: "С дьяволом храбрость не помогает." },
    { es: "Yo vivo en el fondo de estas aguas, incorpórea como ellas, fugaz y transparente.", ru: "Я живу на дне этих вод, бесплотная, как и они, мимолетная и прозрачная." },
    { es: "Fernando dio un paso hacía ella…, otro…, y cayó al agua con un rumor sordo y lúgubre.", ru: "Фернандо сделал шаг к ней... еще один... и упал в воду с глухим и мрачным шумом." }
];

const vocabulary = [
    { word: "Cuento", translation: "Рассказ / сказка", pos: "Существительное" },
    { word: "La pluma", translation: "Перо", pos: "Существительное" },
    { word: "El ciervo", translation: "Олень", pos: "Существительное" },
    { word: "El montero", translation: "Егерь / охотник", pos: "Существительное" },
    { word: "Las zarzas", translation: "Ежевика / терновник", pos: "Существительное" },
    { word: "La trocha", translation: "Тропа", pos: "Существительное" },
    { word: "Enturbiar", translation: "Замутить (воду)", pos: "Глагол" },
    { word: "Atrevimiento", translation: "Дерзость / смелость", pos: "Существительное" },
    { word: "Fiera", translation: "Дикий зверь", pos: "Существительное" },
    { word: "Límpido", translation: "Чистый / прозрачный", pos: "Прилагательное" },
    { word: "Fuegos fatuos", translation: "Блуждающие огоньки", pos: "Устойчивое выражение" }
];

const grammarRules = [
    {
        title: "Конструкция: Hace + время + que + Verb",
        desc: "Используется для выражения действия, которое началось в прошлом и продолжается или имеет значение в настоящем/прошедшем. Пример из текста: <i>Hace mucho tiempo que tenía ganas...</i> (Уже давно мне хотелось...)."
    },
    {
        title: "Повелительное наклонение (Imperativo afirmativo)",
        desc: "Обратите внимание на форму обращения на 'vosotros' в охотничьих призывах: <b>cortadle</b> (перережьте ему), <b>azuzad</b> (натравите), <b>soplad</b> (трубите), <b>hundid</b> (вонзите)."
    },
    {
        title: "Сослагательное наклонение (Subjuntivo)",
        desc: "Выражает гипотетические действия, желания или опасения: <i>...para que vaya a morir</i> (чтобы он ушел умирать), <i>...antes de que sea tarde</i>. Также использован архаичный Future Subjunctive: <i>salvareis</i>."
    },
    {
        title: "Идиома: De hito en hito",
        desc: "Означает 'пристально, не отрывая глаз, в упор': <i>...mirándole de hito en hito</i> (пристально глядя на него)."
    }
];

const quizData = [
    {
        q: "Что означает фраза 'Hace mucho tiempo que...'?",
        options: ["Прошло много времени с тех пор как...", "Уже давно...", "Каждый раз когда...", "Через некоторое время..."],
        correct: 1
    },
    {
        q: "Переведите слово 'El ciervo':",
        options: ["Лошадь", "Волк", "Олень", "Собака"],
        correct: 2
    },
    {
        q: "Какое грамматическое наклонение используется в слове 'cortadle'?",
        options: ["Subjuntivo", "Imperativo", "Indicativo", "Condicional"],
        correct: 1
    },
    {
        q: "Что означает выражение 'De hito en hito'?",
        options: ["Сбоку набок", "Пристально / в упор", "Шопотом", "Быстро и незаметно"],
        correct: 1
    }
];

// App Logic
function init() {
    renderReader();
    renderVocab();
    renderGrammar();
    renderQuiz();
}

function renderReader() {
    const container = document.getElementById('textContainer');
    container.innerHTML = sentences.map((s, i) => `
        <div class="sentence-card">
            <div class="es-text">
                ${s.es}
                <button class="audio-btn" onclick="speak('${escapeQuotes(s.es)}')">🔊 Слушать</button>
            </div>
            <div class="ru-text">${s.ru}</div>
        </div>
    `).join('');
}

function escapeQuotes(str) {
    return str.replace(/'/g, "\\'");
}

function speak(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-ES';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    } else {
        alert("Ваш браузер не поддерживает озвучку текста.");
    }
}

function toggleRu() {
    const show = document.getElementById('toggleTranslation').checked;
    document.querySelectorAll('.ru-text').forEach(el => {
        if(show) el.classList.remove('hidden');
        else el.classList.add('hidden');
    });
}

function renderVocab() {
    const container = document.getElementById('vocabContainer');
    container.innerHTML = vocabulary.map(v => `
        <div class="card">
            <h3>${v.word}</h3>
            <p><b>Перевод:</b> ${v.translation}</p>
            <p style="font-size: 0.8rem; margin-top: 4px; color: var(--accent);">${v.pos}</p>
        </div>
    `).join('');
}

function renderGrammar() {
    const container = document.getElementById('grammarContainer');
    container.innerHTML = grammarRules.map(g => `
        <div class="grammar-rule">
            <h3>${g.title}</h3>
            <p>${g.desc}</p>
        </div>
    `).join('');
}

let currentQuiz = 0;
let score = 0;

function renderQuiz() {
    const container = document.getElementById('quizContainer');
    if (currentQuiz >= quizData.length) {
        container.innerHTML = `
            <h3>Тест завершен! 🎉</h3>
            <p style="margin: 15px 0;">Ваш результат: ${score} из ${quizData.length}</p>
            <button class="btn-action" onclick="resetQuiz()">Пройти снова</button>
        `;
        return;
    }

    const q = quizData[currentQuiz];
    container.innerHTML = `
        <h3 style="margin-bottom: 15px;">Вопрос ${currentQuiz + 1} из ${quizData.length}: ${q.q}</h3>
        ${q.options.map((opt, i) => `
            <button class="quiz-option" onclick="checkAnswer(${i})">${opt}</button>
        `).join('')}
    `;
}

function checkAnswer(selected) {
    const q = quizData[currentQuiz];
    const options = document.querySelectorAll('.quiz-option');
    options.forEach(o => o.style.pointerEvents = 'none');
    
    if (selected === q.correct) {
        options[selected].classList.add('correct');
        score++;
    } else {
        options[selected].classList.add('incorrect');
        options[q.correct].classList.add('correct');
    }

    setTimeout(() => {
        currentQuiz++;
        renderQuiz();
    }, 1500);
}

function resetQuiz() {
    currentQuiz = 0;
    score = 0;
    renderQuiz();
}

function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    event.target.classList.add('active');
}

window.onload = init;
</script>
</body>
</html>
